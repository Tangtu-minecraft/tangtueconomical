  钱包    config/kjbb/wallet.txt
  行情    config/kjbb/kline.txt
  机器人  config/kjbb/bots.json
  数据包  <存档>/datapacks/tangtu/.../kjbb/
对 KubeJS 暴露 BankBridge / MarketBridge / ShopBridge。
'''

